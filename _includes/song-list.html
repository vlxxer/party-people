<ul class="song-list">
  {% assign sorted_songs = include.songs | default: site.songs | sort: "date" | reverse %}
  {% for song in songs_sorted %}
  <li>
    <time datetime="{{ song.date | date_to_xmlschema }}">{{ song.date | date: "%d/%m/%Y" }}</time>
    &mdash; <a href="{{ song.url | relative_url }}">{{ song.title }}</a>.
  </li>
  {% endfor %}
</ul>
